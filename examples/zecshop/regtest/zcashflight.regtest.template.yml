# ZcashFlight policy for ZecShop on a local Zebra + Zallet regtest network (Z3).
# Generated by regtest/setup.ts with this wallet's real regtest addresses. Run it:
#   zcashflight run --policy zcashflight.regtest.yml
# Every payment, sweep and refund below is a real transaction built by Zallet and mined by Zebra.

version: 1
network: regtest

app:
  name: ZecShop (regtest)
  start: node server.ts
  url: http://127.0.0.1:4600
  ready: /health
  env:
    PORT: 4600
    WALLET_MOCK: 0
    WALLET_RPC: {{WALLET_RPC}}
    ZEBRA_RPC: {{ZEBRA_RPC}}
    WALLET_RPC_USER: {{WALLET_RPC_USER}}
    WALLET_RPC_PASSWORD: {{WALLET_RPC_PASSWORD}}
    MERCHANT_ACCOUNT: {{MERCHANT_ACCOUNT}}
    MERCHANT_ADDRESS: {{MERCHANT_ADDRESS}}
    COLD_STORAGE: {{COLD_STORAGE}}
    REGTEST_CUSTOMER_ADDRESS: {{REGTEST_CUSTOMER_ADDRESS}}

protect:
  - addresses
  - amounts
  - memos
  - transaction IDs
  - viewing keys
  - spending keys
  - seed phrases

destinations:
  - host: {{WALLET_HOST}}
    purpose: Zallet wallet RPC (regtest). Builds and broadcasts transactions.
    allow: [addresses, amounts, memos, transaction IDs]
  - host: {{ZEBRA_HOST}}
    purpose: Zebra node RPC (regtest). The test harness mines blocks; no payment data.
    allow: []
  - host: analytics.example.com
    purpose: Product analytics. Event names only.
    allow: []
  - host: errors.example.io
    purpose: Error monitoring. Scrubbed error reports only.
    allow: []

logs:
  - logs/server.log

transactions:
  shielded_only: true

sinkhole: true

scenarios:
  - name: checkout
    description: A customer checks out, pays the ZIP 321 request from their wallet, and the shop sweeps to cold storage.
    steps:
      - request: POST /api/checkout
        json:
          name: Amina
          items: [{sku: hoodie, qty: 1}, {sku: sticker-pack, qty: 1}]
          refund_address: {{CUSTOMER_UA}}
        save: {order: order_id}
      - request: POST /regtest/pay/{{order}}
        timeout_ms: 180000
      - request: POST /api/orders/{{order}}/paid
        timeout_ms: 180000
      - request: POST /regtest/mine

  - name: refunds
    description: A returning customer with a legacy transparent address pays, then the order fails and is refunded.
    steps:
      - request: POST /api/checkout
        json:
          name: Amina
          items: [{sku: sticker-pack, qty: 2}]
          refund_address: {{CUSTOMER_UA}}
          legacy_refund_address: {{CUSTOMER_TADDR}}
        save: {order: order_id}
      - request: POST /regtest/pay/{{order}}
        timeout_ms: 180000
      - request: POST /api/orders/{{order}}/fail
        timeout_ms: 180000
      - request: POST /regtest/mine

  - name: errors
    description: The wallet times out while a customer checks their order status.
    steps:
      - request: POST /api/checkout
        json:
          name: Amina
          items: [{sku: hoodie, qty: 1}]
        save: {order: order_id}
      - request: GET /api/orders/{{order}}?simulate=timeout
        expect: 504

not_tested:
  - Browser and mobile clients
  - Network metadata such as IP address and request timing at the transport layer
  - Zebra and Zallet themselves (they are the trusted wallet and node in this test)
