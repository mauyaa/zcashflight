name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      # The PRD's success criteria as a gate: the seeded app must fail, the fixed app must pass.
      - run: npm run demo
      # The installed package runs from dist/: build it, then run the demo from the build
      - run: npm run build && ZCASHFLIGHT_DIST=1 node bin/zcashflight.js version && ZCASHFLIGHT_DIST=1 npm run demo
